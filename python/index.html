<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 入门 · 动手实践 · YF308AI实验室开放学习平台</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/logo-180.png">
<style>
:root{
  --bg:#ffffff; --fg:#1b1b1b; --muted:#6b6b6b; --line:#e6e6e6; --card:#fafafa;
  --code-bg:#f6f6f6; --accent:#222; --ok:#2f7d3a; --warn:#8a6d00; --pill:#f0f0f0;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151515; --fg:#e9e9e9; --muted:#9b9b9b; --line:#2b2b2b; --card:#1d1d1d;
    --code-bg:#191919; --accent:#e9e9e9; --ok:#7bc888; --warn:#d8bd5a; --pill:#242424;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
}
:root[data-theme="light"]{ --bg:#fff;--fg:#1b1b1b;--muted:#6b6b6b;--line:#e6e6e6;--card:#fafafa;--code-bg:#f6f6f6;--accent:#222;--pill:#f0f0f0;}
:root[data-theme="dark"]{ --bg:#151515;--fg:#e9e9e9;--muted:#9b9b9b;--line:#2b2b2b;--card:#1d1d1d;--code-bg:#191919;--accent:#e9e9e9;--pill:#242424;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
header{text-align:center;padding:3rem 1.2rem 1.4rem}
h1{font-size:1.9rem;margin:0 0 .5rem;letter-spacing:.01em;font-weight:700}
.sub{color:var(--muted);margin:0 auto;max-width:660px;font-size:.98rem}
.seg{display:flex;gap:.3rem;justify-content:center;margin:1.6rem auto 0;
  background:var(--pill);border-radius:999px;padding:.3rem;width:max-content}
.seg button{border:0;background:transparent;color:var(--muted);font-size:1rem;
  padding:.5rem 1.6rem;border-radius:999px;cursor:pointer;font-weight:600;transition:.15s}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:var(--shadow)}
.parts{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:.7rem 1rem;margin-top:1.4rem;
  display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap}
.parts button{border:1px solid var(--line);background:var(--bg);color:var(--fg);
  font-size:.86rem;padding:.32rem .8rem;border-radius:999px;cursor:pointer;transition:.15s}
.parts button:hover{background:var(--card)}
.parts button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
main{max-width:1000px;margin:0 auto;padding:1.6rem 1.2rem 4rem}
.part-title{font-size:1.4rem;font-weight:700;margin:.4rem 0 1.4rem;
  padding-bottom:.7rem;border-bottom:2px solid var(--line)}
.pages{display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.page{width:100%;max-width:820px;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;box-shadow:var(--shadow);background:#fff}
.page img{display:block;width:100%;height:auto;aspect-ratio:210/297}
.page .cap{text-align:center;color:var(--muted);font-size:.78rem;padding:.35rem;
  background:var(--card);border-top:1px solid var(--line)}
.lead{color:var(--muted);max-width:820px;margin:0 auto 1.2rem;text-align:center;font-size:.92rem}
.summary{max-width:860px;margin:0 auto 1.6rem;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary summary{cursor:pointer;padding:.8rem 1.1rem;font-weight:700;background:var(--card);user-select:none}
.summary table{width:100%;border-collapse:collapse;font-size:.86rem}
.summary th,.summary td{text-align:left;padding:.55rem .8rem;border-top:1px solid var(--line);vertical-align:top}
.summary th{color:var(--muted);font-weight:600;background:var(--card)}
.summary td:first-child{white-space:nowrap;font-weight:600}
.ex{border:1px solid var(--line);border-radius:14px;margin:1.2rem auto;max-width:860px;
  overflow:hidden;box-shadow:var(--shadow)}
.ex-h{background:var(--card);padding:.9rem 1.1rem;font-weight:700;display:flex;gap:.6rem;align-items:baseline}
.ex-h .tag{font-size:.72rem;color:var(--bg);background:var(--accent);border-radius:20px;padding:.12rem .6rem}
.ex-b{padding:.5rem 1.1rem 1.1rem}
.ex-b p{margin:.75rem 0}
.data{color:var(--warn);font-weight:700}
details.fold{margin:.6rem 0;border:1px solid var(--line);border-radius:9px;background:var(--code-bg)}
details.fold>summary{cursor:pointer;padding:.6rem .95rem;font-size:.9rem;user-select:none;font-weight:600}
details.fold>summary:hover{color:var(--accent)}
details.fold pre{margin:0;padding:.95rem 1.1rem;overflow-x:auto;background:var(--code-bg);
  border-top:1px solid var(--line);font-size:.82rem;line-height:1.55}
code{font-family:"SF Mono",Consolas,"Cascadia Code",monospace}
.hint{padding:.65rem .95rem;color:var(--muted);font-size:.92rem}
.exp{color:var(--ok);font-weight:700}
/* Notebook 风格代码单元 + 语法配色 */
.cell{display:flex;border:1px solid #2b2b2b;border-radius:8px;overflow:hidden;background:#1e1e1e;margin-top:.4rem}
.cell.out{margin-top:.5rem}
.gutter{flex:0 0 54px;background:#181818;padding:.7rem .45rem;text-align:right;
  font-family:Consolas,monospace;font-size:.72rem;color:#6a9bd1;user-select:none;
  display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
.gutter .play{border:0;background:transparent;color:#4ec9b0;cursor:pointer;font-size:1rem;padding:0;line-height:1}
.gutter .play:hover{color:#7fe9d4}
.gutter .delc{border:0;background:transparent;color:#666;cursor:pointer;font-size:.95rem;padding:0;line-height:1;margin-top:auto}
.gutter .delc:hover{color:#e06c75}
.gutter .outp{color:#c586c0}
.edwrap{position:relative;flex:1;min-width:0}
.edwrap pre.hl,.edwrap textarea{margin:0;padding:.7rem 1rem;box-sizing:border-box;
  font-family:Consolas,"Cascadia Code",Menlo,monospace;font-size:var(--edfs,14px);line-height:1.6;
  tab-size:4;white-space:pre;overflow-wrap:normal;letter-spacing:0;border:0}
.edwrap pre.hl{position:absolute;inset:0;overflow:hidden;color:#d4d4d4;pointer-events:none}
.edwrap textarea{position:relative;display:block;width:100%;height:var(--cellh,300px);min-height:110px;
  outline:0;resize:vertical;background:transparent;color:transparent;caret-color:#e6e6e6;overflow:auto}
.edwrap textarea::selection{background:#264f78;color:transparent}
.hl .ckw{color:#569cd6}.hl .cst{color:#ce9178}.hl .ccm{color:#6a9955}.hl .cnu{color:#b5cea8}.hl .cfn{color:#dcdcaa}.hl .cbi{color:#4ec9b0}
.exbar{display:flex;gap:.55rem;align-items:center;margin:.6rem 0;flex-wrap:wrap}
.exbar button{border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:.85rem;padding:.44rem .9rem;border-radius:6px;cursor:pointer}
.exbar button:hover{background:var(--card)}
.exbar .runall{background:#0e639c;color:#fff;border-color:#0e639c;font-weight:600}
.exbar .runall:hover{background:#1177bb}
.exbar .runall:disabled{opacity:.5;cursor:default}
.runstat{color:var(--muted);font-size:.85rem}
.dl{font-size:.72rem;font-weight:400;margin-left:.5rem;padding:.2rem .55rem;border:1px solid var(--line);
  border-radius:5px;color:var(--muted);text-decoration:none;vertical-align:middle;white-space:nowrap}
.dl:hover{border-color:var(--fg);color:var(--fg)}
.exbar .submit{background:#2e7d32;color:#fff;border-color:#2e7d32;font-weight:600}
.exbar .submit:hover{background:#388e3c}
.exbar .submit:disabled{opacity:.5;cursor:default}
.judge{margin:.55rem 0 0;padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);font-size:.87rem;line-height:1.7}
.judge.ok{border-color:#2e7d32}
.judge.no{border-color:#b8860b}
.judge .jtitle{font-weight:600;margin-bottom:.35rem}
.judge ul{margin:.3rem 0 0;padding-left:1.2rem}
.judge li{margin:.12rem 0}
.judge li.y{color:#2e7d32}
.judge li.n{color:var(--muted)}
.output{margin:0;padding:.7rem 1rem;background:#1e1e1e;color:#d4d4d4;flex:1;min-width:0;
  font-family:Consolas,Menlo,monospace;font-size:var(--edfs,14px);line-height:1.55;white-space:pre-wrap;max-height:400px;overflow:auto}
.fontctl{display:flex;align-items:center;gap:.4rem;margin-top:1.4rem;padding:0 .4rem;color:var(--muted);font-size:.82rem}
.fontctl button{border:1px solid var(--line);background:var(--bg);color:var(--fg);width:28px;height:26px;border-radius:6px;cursor:pointer;font-size:.85rem}
.fontctl button:hover{background:var(--card)}
.view{display:none}
.view.on{display:block}
footer{color:var(--muted);font-size:.86rem;padding:1.6rem 1.2rem 3rem;border-top:1px solid var(--line);max-width:1000px;margin:0 auto}
footer code{background:var(--code-bg);padding:.1rem .4rem;border-radius:5px}
.theme{position:fixed;top:1rem;right:1rem;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1rem;z-index:30}
.app{display:flex;align-items:flex-start;max-width:1180px;margin:0 auto}
.sidebar{position:sticky;top:0;align-self:flex-start;width:212px;flex:0 0 212px;height:100vh;
  overflow-y:auto;border-right:1px solid var(--line);padding:1.5rem .8rem}
.sidebar .brand{margin:0 .4rem 1.1rem}
.sidebar .brand .hbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.82rem;padding:0 0 .35rem}
.sidebar .brand .hbtn:hover{color:var(--fg)}
.sidebar .brand .tname{font-weight:700;font-size:1.02rem;line-height:1.4}
.home{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:82vh;text-align:center;padding:2rem 1.2rem}
.home.show{display:flex}
.home-title{font-size:2rem;font-weight:700;margin:0 0 .5rem}
.plate{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px}
.plate img{width:92px;height:92px}
.plate .pname{font-size:1.05rem;font-weight:650;letter-spacing:.04em}
.brand-mini{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brand-mini img{width:26px;height:26px}
.brand-mini span{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3}
.home-sub{color:var(--muted);max-width:560px;margin:0 0 2.4rem;font-size:.98rem;line-height:1.7}
.cards{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center}
.card{width:300px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:1.7rem 1.5rem;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card-t{font-size:1.3rem;font-weight:700;margin-bottom:.55rem}
.card-s{color:var(--muted);font-size:.92rem;line-height:1.65}
.card-n{margin-top:1.1rem;font-size:.8rem;color:var(--accent);font-weight:700}
.vtoggle{display:flex;gap:.25rem;background:var(--pill);border-radius:999px;padding:.25rem;margin-bottom:1.1rem}
.vtoggle button{flex:1;border:0;background:transparent;color:var(--muted);padding:.45rem 0;
  border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem}
.vtoggle button.on{background:var(--bg);color:var(--fg);box-shadow:var(--shadow)}
.chaps{display:flex;flex-direction:column;gap:.15rem}
.chaps .chap{text-align:left;border:0;background:transparent;color:var(--fg);
  padding:.52rem .6rem;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.12s;width:100%}
.chaps .chap:hover{background:var(--card)}
.chaps .chap.on{background:var(--accent);color:var(--bg);font-weight:600}
.subs{display:flex;flex-direction:column;gap:.04rem;margin:.15rem 0 .4rem;
  border-left:2px solid var(--line);padding-left:.3rem;margin-left:.5rem}
.chaps .sub{display:block;text-align:left;border:0;background:transparent;color:var(--muted);
  margin:0;max-width:none;width:100%;
  padding:.32rem .55rem;border-radius:6px;cursor:pointer;font-size:.79rem;line-height:1.35;transition:.12s}
.chaps .sub:hover{background:var(--card);color:var(--fg)}
.content{flex:1;min-width:0;padding:1.8rem 1.7rem 4rem}
.content .part-title{margin-top:0}
@media(max-width:820px){
  .app{flex-direction:column}
  .sidebar{position:static;width:auto;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:1rem}
  .sidebar .brand{text-align:center}
  .chaps{flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
  .chaps .chap{border:1px solid var(--line);border-radius:999px;padding:.32rem .8rem;font-size:.84rem;width:auto}
  .subs{flex-basis:100%;flex-direction:column;justify-content:flex-start;align-items:flex-start;border-left:2px solid var(--line);padding-left:.4rem;margin:.15rem 0 .4rem 1rem}
  .chaps .sub{display:block;text-align:left;border:0;border-radius:6px;padding:.3rem .5rem;margin:0;max-width:none;width:100%}
  .content{padding:1.3rem 1.1rem 3rem}
}

/* 运行设置面板 */
.gear{position:fixed;top:14px;right:58px;z-index:60;background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;
  font-size:15px;transition:border-color .15s}
.gear:hover{border-color:var(--fg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal-box{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;
  max-width:470px;width:100%;padding:26px 28px 22px;max-height:88vh;overflow:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.22)}
.steps{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-bottom:7px}
.modal-box h3{margin:0 0 7px;font-size:19px;font-weight:650;letter-spacing:-.01em}
.modal-box .sub2{color:var(--dim);font-size:13px;line-height:1.65;margin:0 0 18px}
/* 选项卡 */
.rmode{display:block;padding:13px 15px;border:1px solid var(--line);border-radius:10px;
  margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s}
.rmode:hover{border-color:var(--dim)}
.rmode.on{border-color:var(--fg);background:var(--bg)}
.rmode input{margin-right:9px}
.rmode b{font-size:14.5px;font-weight:600}
.rmode span{display:block;color:var(--dim);font-size:12.5px;line-height:1.6;margin-top:5px;padding-left:23px}
/* SSH 提示条 */
.sshhint{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:16px}
.sshhint .t{font-size:11.5px;color:var(--dim);margin-bottom:6px}
.sshhint code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--fg);word-break:break-all}
.sshhint code b{font-weight:700;border-bottom:2px solid var(--dim);padding-bottom:1px}
/* 表单 */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px;margin-bottom:14px}
.fgrid .full{grid-column:1 / -1}
.fld label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px}
.fld input{width:100%;box-sizing:border-box;padding:8px 11px;font-size:13px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);
  font-family:inherit;transition:border-color .15s}
.fld input:focus{outline:none;border-color:var(--fg)}
.fld input::placeholder{color:var(--dim);opacity:.6}
/* 测试连接 */
.testrow{display:flex;gap:11px;align-items:center;margin-bottom:14px}
.testrow button{padding:7px 15px;font-size:12.5px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);cursor:pointer;font-family:inherit;flex:none;transition:border-color .15s}
.testrow button:hover{border-color:var(--fg)}
.tres{font-size:12px;color:var(--dim);line-height:1.55}
.tres.good{color:#3a7d44} .tres.bad{color:#a8443a}
/* 环境结论 */
.envbox{font-size:13px;line-height:1.7;padding:12px 14px;border-radius:9px;margin-bottom:14px;
  background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.envbox.good{border-color:#3a7d44}
.envbox.warnbox{border-color:#9a7b2f}
.engines{display:flex;gap:10px;margin-bottom:14px}
.eng{flex:1;display:flex;align-items:center;gap:9px;padding:14px 16px;border:1px solid var(--line);
  border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:600}
.eng:has(input:checked){border-color:var(--acc);background:var(--codebg)}
.eng input{accent-color:var(--acc);width:16px;height:16px}
.urlrow{display:flex;gap:9px;align-items:stretch;margin-bottom:14px}
.urlrow input{flex:1;min-width:0;background:var(--codebg);color:var(--fg);border:1px solid var(--line);
  border-radius:9px;padding:0 14px;height:44px;font-size:14px;font-family:inherit}
.urlrow button{height:44px;padding:0 24px;white-space:nowrap}
.stdinrow{display:none;margin:8px 0 0}
.stdinrow textarea{width:100%;min-height:54px;background:var(--codebg);color:var(--fg);border:1px solid var(--line);
  border-radius:9px;padding:10px 13px;font-size:13.5px;font-family:Consolas,monospace;resize:vertical}
.figs{display:flex;flex-wrap:wrap;gap:10px;padding:0 0 6px}
.figs img{max-width:100%;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line)}
#engtag{cursor:pointer;text-decoration:underline dotted}
.cmd{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;user-select:all;
  word-break:break-all;color:var(--fg)}
/* 说明与按钮 */
.note{font-size:11.5px;color:var(--dim);line-height:1.75;margin:0}
.mbtns{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--line)}
.mbtns button{padding:8px 18px;font-size:13px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);cursor:pointer;font-family:inherit;transition:.15s}
.mbtns button:hover{border-color:var(--fg)}
.mbtns .ok{background:var(--fg);color:var(--card);border-color:var(--fg)}
.mbtns .ok:hover{opacity:.85}
</style>
</head>
<script src="../assets/runner.js"></script>
<body>
<button class="gear" onclick="openRunCfg()" title="运行设置">⚙</button>
<button class="theme" onclick="toggleTheme()" title="切换深浅色">◐</button>
<div id="home" class="home show">
  <div class="plate"><img src="../assets/logo.png" alt="YF308AI实验室开放学习平台"><div class="pname">YF308AI实验室开放学习平台</div></div>
  <h1 class="home-title">Python 入门 · 动手实践</h1>
  <p class="home-sub">从零开始学 Python，十二章覆盖基础语法到数据分析。每章先跑通一个小程序，再讲清背后的原理。讲义可以下载 PDF。</p>
  <div class="cards">
    <button class="card" onclick="setTrack('py')">
      <div class="card-t">Python 基础</div>
      <div class="card-s">跑通第一个程序、变量与类型、列表与字典、分支与循环、函数</div>
      <div class="card-n">第 0 到 11 章 · 24 道练习</div>
    </button>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand" id="brand"></div>
    <div class="vtoggle">
      <button id="seg-know" class="on" onclick="setView('know')">知识点</button>
      <button id="seg-lab" onclick="setView('lab')">实战</button>
    </div>
    <nav class="chaps" id="parts"></nav>
    <div class="fontctl">代码字号 <button onclick="setFont(-1)">A-</button><button onclick="setFont(1)">A+</button></div>
  </aside>
  <div class="content">
    <div id="view-know" class="view on">
      <div class="part-title" id="know-title"></div>
      <div class="pages" id="know-pages"></div>
    </div>
    <div id="view-lab" class="view">
      <div class="part-title" id="lab-title"></div>
      <details class="summary" id="lab-summary"></details>

`primes = []

  task:"写三个函数：算平均分、按分数给等级、生成一个人的成绩小结。然后用它们处理三个人的成绩。",
  hint:"每个函数只做一件事，用 return 把结果交出去而不是直接打印。生成小结的函数内部调用前两个。遍历字典用 items 一次拿到名字和分数。",
  start:
`data = {"小明": [86, 92, 78], "小红": [95, 88, 91], "小刚": [55, 61, 48]}

# TODO: 写 average(nums) 返回平均分
# TODO: 写 level_of(score) 返回优秀 良好 及格 不及格
# TODO: 写 report(name, scores) 返回一行小结字符串
# TODO: 遍历 data，打印每个人的小结`,
  sol:
`def average(nums):
    """算平均分"""
    return sum(nums) / len(nums)

def level_of(score):
    """按分数给等级"""
    if score >= 90:
        return "优秀"
    if score >= 80:
        return "良好"
    if score >= 60:
        return "及格"
    return "不及格"

def report(name, scores):
    """生成一个人的成绩小结"""
    avg = average(scores)
    return f"{name}  平均 {avg:.1f}  {level_of(avg)}"

data = {"小明": [86, 92, 78], "小红": [95, 88, 91], "小刚": [55, 61, 48]}
for name, scores in data.items():
    print(report(name, scores))`,
  exp:"小明良好、小红优秀、小刚不及格。注意三个函数都用 return 而不是 print，这样结果能被别的函数继续用，report 就是这么调用前两个的。"},
{tag:"练习 4.2",title:"密码强度检查",
  task:"写一个函数检查密码强度，返回说明文字和是否通过两个值。规则是至少 8 位，且必须同时含字母和数字。用三个不同的密码测试它。",
  hint:"一次返回两个值就用逗号隔开。判断字符串里有没有数字可以用 any 配合每个字符的 isdigit 方法，字母用 isalpha。",
  start:
`# TODO: 写 check(pwd) 返回说明和是否通过两个值
# TODO: 规则：不足 8 位不通过；不同时含字母和数字不通过；否则通过
# TODO: 用 abc、abcdefgh、abcd1234 三个密码分别测试并打印`,
  sol:
`def check(pwd):
    """返回强度说明和是否通过"""
    if len(pwd) < 8:
        return "太短，至少 8 位", False
    has_digit = any(c.isdigit() for c in pwd)
    has_alpha = any(c.isalpha() for c in pwd)
    if not (has_digit and has_alpha):
        return "要同时含字母和数字", False
    return "通过", True

for pwd in ["abc", "abcdefgh", "abcd1234"]:
    msg, ok = check(pwd)
    print(pwd, msg, ok)`,
  exp:"只有 abcd1234 通过。一次返回两个值、接收时也用逗号，是函数返回多项结果的常用写法，判断和说明就能一起拿到。"}],

`def safe_get(d, keys, default=None):
    """按多级键取值，取不到就返回默认值"""
    cur = d

    except (KeyError, TypeError, IndexError):

    def __init__(self):
        self.items = []

    def add(self, name, price, qty=1):

    def remove(self, name):

                self.items.remove(it)

  start:
`class Account:

    # TODO: deposit(amount) 存钱

`class Account:
    """账户基类"""
    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance

    def deposit(self, amount):
        self.balance += amount
        return self.balance

    def withdraw(self, amount):
        self.balance -= amount
        return True

    def __repr__(self):
        return self.owner + " 余额 " + str(self.balance)


class Saving(Account):
    """储蓄账户，不许透支"""
    def withdraw(self, amount):
        if amount > self.balance:
            return False
        self.balance -= amount
        return True


class Credit(Account):
    """信用账户，可以透支到 limit"""
    def __init__(self, owner, balance=0, limit=1000):
        super().__init__(owner, balance)
        self.limit = limit

    def withdraw(self, amount):
        if self.balance - amount < -self.limit:
            return False
        self.balance -= amount
        return True


s = Saving("小明", 500)
print(s, "取 300：", s.withdraw(300), s)
print("再取 300：", s.withdraw(300), s)

c = Credit("小红", 500, limit=1000)
print(c, "取 1200：", c.withdraw(1200), c)
print("再取 500：", c.withdraw(500), c)`,

`import random
import pandas as pd
from pathlib import Path

random.seed(7)
cats = ["文学", "科技", "历史", "艺术"]
rows = [{"id": i + 1, "month": random.randint(1, 12),
         "category": random.choice(cats), "days": random.randint(1, 60)}
        for i in range(200)]
df = pd.DataFrame(rows)

by_cat = df.groupby("category").size().sort_values(ascending=False)
lines = []
lines.append("借阅分析报告")
lines.append("=" * 24)
lines.append("总借阅次数：" + str(len(df)))
lines.append("平均借阅天数：" + str(round(df["days"].mean(), 1)))
lines.append("最受欢迎的类别：" + by_cat.index[0] + "，" + str(by_cat.iloc[0]) + " 次")
lines.append("")
lines.append("各类别明细：")
for cat, n in by_cat.items():
    lines.append("  " + cat + "  " + str(n) + " 次")

Path("report.txt").write_text("\\n".join(lines), encoding="utf-8")
df.to_csv("clean.csv", index=False, encoding="utf-8-sig")
print("已写出 report.txt 和 clean.csv")

print()
print(Path("report.txt").read_text(encoding="utf-8"))`,

};

function pad(p, i){ return PAGE_COUNT[p]>=10 ? String(i).padStart(2,"0") : String(i); }
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderKnow(){
  document.getElementById("know-title").innerHTML =
    "第" + PART_NAMES[part] +

  for(let i=1;i<=PAGE_COUNT[part];i++)
    h += `<div class="page"><img loading="lazy" src="pages/p${part}-${pad(part,i)}.png?${VER}" alt="第${part}部分 第${i}页"><div class="cap">${part} · ${i} / ${PAGE_COUNT[part]}</div></div>`;

function renderSummary(){
  let rows = SUMMARY.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");
  document.getElementById("lab-summary").innerHTML =

}
const KW = new Set(["def","class","return","if","elif","else","for","while","in","not","and","or","is","import","from","as","with","try","except","finally","lambda","yield","pass","break","continue","global","nonlocal","del","raise","assert","None","True","False","async","await"]);
const BI = new Set(["print","range","len","super","self","torch","nn","F","int","float","str","list","dict","set","tuple","sum","min","max","open","enumerate","zip","sorted","round"]);
function highlight(code){
  let e = code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return e.replace(/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d+\.?\d*\b)|([A-Za-z_]\w*)/g,
    function(m, com, str, num, word){
      if(com) return '<span class="ccm">'+com+'</span>';
      if(str) return '<span class="cst">'+str+'</span>';
      if(num) return '<span class="cnu">'+num+'</span>';
      if(word){
        if(KW.has(word)) return '<span class="ckw">'+word+'</span>';
        if(BI.has(word)) return '<span class="cbi">'+word+'</span>';
        return word;
      }
      return m;
    });
}
function onEdit(id){ setTimeout(function(){syncStdin(id);},0);
  const ta=document.getElementById(id), hl=document.getElementById("hl-"+id);
  hl.innerHTML = highlight(ta.value) + "\n";
  hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
}
function syncScroll(id){
  const ta=document.getElementById(id), hl=document.getElementById("hl-"+id);
  hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
}
function keyHandler(ev, cid){
  if(ev.key==="Tab"){
    ev.preventDefault();
    const t=ev.target, s=t.selectionStart, en=t.selectionEnd;
    t.value=t.value.slice(0,s)+"    "+t.value.slice(en);
    t.selectionStart=t.selectionEnd=s+4; onEdit(cid);
  } else if(ev.key==="Enter" && (ev.ctrlKey||ev.metaKey)){
    ev.preventDefault(); runCell(cid);                 // Ctrl/Cmd+Enter：运行本单元
  } else if(ev.key==="Enter" && ev.shiftKey){
    ev.preventDefault(); runCell(cid);                 // Shift+Enter：运行并跳到下一单元
    const cells=document.getElementById("wrap-"+cid).closest(".cells");
    const tas=[...cells.querySelectorAll("textarea")];
    const idx=tas.findIndex(t=>t.id===cid);
    if(idx<tas.length-1) tas[idx+1].focus();
    else addCell(cells.closest(".ex").id);             // 已是最后一个就新建一个
  }
}
let EDFS=14;
function setFont(d){ EDFS=Math.max(10,Math.min(24,EDFS+d)); document.documentElement.style.setProperty("--edfs", EDFS+"px"); }
let CID=0;
function cellHTML(cid, code){
  return `<div class="cell" id="wrap-${cid}">
      <div class="gutter"><button class="play" title="运行到这里" onclick="runCell('${cid}')">▶</button><span>In</span><button class="delc" title="删除本单元" onclick="delCell('${cid}')">×</button></div>
      <div class="edwrap">
        <pre class="hl" id="hl-${cid}"></pre>
        <textarea class="editor" id="${cid}" spellcheck="false" oninput="onEdit('${cid}')" onscroll="syncScroll('${cid}')" onkeydown="keyHandler(event,'${cid}')">${escapeHtml(code)}</textarea>
      </div>
    </div>
    <div class="cell out" id="outcell-${cid}" style="display:none">
      <div class="gutter"><span class="outp">Out</span></div>
      <div style="flex:1;min-width:0"><pre class="output" id="out-${cid}"></pre><div class="figs" id="figs-${cid}"></div></div>
    </div>`;
}
function renderLab(){
  document.getElementById("lab-title").textContent = "第" + PART_NAMES[part];
  let h = "";
  const list = LAB[part] || [];
  if(list.length===0){
    document.getElementById("lab-body").innerHTML = '<p class="lead">本章以讲解为主，没有配套练习。可以到相邻章节动手，或在知识点里复习本章内容。</p>';
    return;
  }
  list.forEach((e, k)=>{
    const exId = `ex-${part}-${k}`, cid = "c"+(CID++);
    h += `<div class="ex" id="${exId}"><div class="ex-h"><span class="tag">${e.tag}</span>${e.title}</div><div class="ex-b">
      <p>${e.task}</p>
      <details class="fold"><summary>提示</summary><div class="hint">${e.hint}</div></details>
      <div class="cells">${cellHTML(cid, e.start)}</div>
      <div class="exbar">
        <button class="runall" onclick="runAll('${exId}')">▶ 运行全部</button>
        <button onclick="addCell('${exId}')">+ 添加单元</button>
        <button class="submit" onclick="submitEx('${exId}','${e.tag.replace("练习 ","")}')">提交检查</button>
        <button onclick="resetEx('${exId}', ${part}, ${k})">重置</button>
        <span class="runstat" id="stat-${exId}"></span>
      </div>
      <div class="stdinrow"><textarea spellcheck="false" placeholder="运行时输入，一行一个"></textarea></div>
      <div class="judge" id="judge-${exId}" style="display:none"></div>
      <details class="fold"><summary>参考答案，可复制到单元里运行</summary><pre><code>${escapeHtml(e.sol)}</code></pre>
        <div class="hint"><span class="exp">预期</span>：${e.exp}</div></details>
    </div></div>`;
  });
  document.getElementById("lab-body").innerHTML = h;
  document.querySelectorAll("#lab-body .cells textarea").forEach(t=>onEdit(t.id));
}
function addCell(exId){
  const cells=document.querySelector("#"+exId+" .cells"), cid="c"+(CID++);
  cells.insertAdjacentHTML("beforeend", cellHTML(cid, ""));
  onEdit(cid); document.getElementById(cid).focus();
}
function delCell(cid){
  const cells=document.getElementById("wrap-"+cid).closest(".cells");
  if(cells.querySelectorAll("textarea").length<=1) return;      // 至少留一个单元
  document.getElementById("wrap-"+cid).remove();
  const oc=document.getElementById("outcell-"+cid); if(oc) oc.remove();
}
function resetEx(exId, p, k){
  const cells=document.querySelector("#"+exId+" .cells"), cid="c"+(CID++);
  cells.innerHTML=cellHTML(cid, LAB[p][k].start); onEdit(cid);
  document.getElementById("stat-"+exId).textContent="";
  const jd=document.getElementById("judge-"+exId); if(jd) jd.style.display="none";
}
async function runCell(cid){
  const cells=document.getElementById("wrap-"+cid).closest(".cells");
  const tas=[...cells.querySelectorAll("textarea")];
  const idx=tas.findIndex(t=>t.id===cid);
  const code=tas.slice(0, idx+1).map(t=>t.value).join("\n\n");    // 连同上面的单元一起跑
  await execute(code, cid, cells.closest(".ex"));
}
async function runAll(exId){
  const cells=document.querySelector("#"+exId+" .cells");
  const tas=[...cells.querySelectorAll("textarea")];
  const code=tas.map(t=>t.value).join("\n\n");
  await execute(code, tas[tas.length-1].id, document.getElementById(exId));
}
function syncStdin(id){
  const ta=document.getElementById(id); if(!ta) return;
  const ex=ta.closest(".ex"); if(!ex) return;
  const row=ex.querySelector(".stdinrow"); if(!row) return;
  const need=[...ex.querySelectorAll(".cells textarea")].some(t=>/\binput\s*\(/.test(t.value));
  row.style.display = need ? "block" : "none";
}
function stdinOf(ex){
  const row=ex && ex.querySelector(".stdinrow");
  return (row && row.style.display!=="none") ? row.querySelector("textarea").value : "";
}
async function bootEngine(){
  const box=document.getElementById("envbox");
  box.className="envbox"; box.textContent="正在连接";
  try{
    await Runner.boot(s=>{ if(s) box.textContent=s; });
    box.className="envbox good"; box.textContent=Runner.label()+" 就绪";
  }catch(err){
    box.className="envbox warnbox";
    box.textContent = Runner.mode==="backend" ? "连不上 "+Runner.url : "运行环境没加载出来，检查网络";
  }
  const tag=document.getElementById("engtag"); if(tag) tag.textContent=Runner.label();
}
function pickEngine(m){
  Runner.mode=m;
  document.getElementById("backrow").style.display = m==="backend" ? "block" : "none";
  if(m==="browser") bootEngine(); else document.getElementById("envbox").textContent="";
}
function connectBackend(){
  Runner.url=document.getElementById("runurl").value.trim();
  bootEngine();
}
function openRunCfg(){
  document.getElementById("runcfg").style.display = "flex";
  const r=document.querySelector('input[name=eng][value="'+Runner.mode+'"]'); if(r) r.checked=true;
  document.getElementById("runurl").value = Runner.url;
  document.getElementById("backrow").style.display = Runner.mode==="backend" ? "block" : "none";
  bootEngine();
}
function closeRunCfg(){
  localStorage.setItem("runSeen","1");
  document.getElementById("runcfg").style.display = "none";
}
async function submitEx(exId, id){
  const ex=document.getElementById(exId);
  const code=[...ex.querySelectorAll(".cells textarea")].map(t=>t.value).join("\n\n");
  const box=document.getElementById("judge-"+exId);
  const btns=ex.querySelectorAll(".submit,.runall,.play");
  box.style.display="block"; box.className="judge"; box.innerHTML="正在检查…";
  btns.forEach(b=>b.disabled=true);
  try{
    const j=await Runner.check(code, id);
    if(j.ok===null||j.ok===undefined){ box.innerHTML=j.msg||"没法判定"; return; }
    box.className="judge "+(j.ok?"ok":"no");
    let h=`<div class="jtitle">${j.ok?"做对了":"还没通过"}　${j.msg}</div><ul>`;
    for(const it of j.items) h+=`<li class="${it.pass?"y":"n"}">${it.pass?"已完成":"待完成"}　${it.desc}</li>`;
    h+="</ul>";
    if(!j.ok && j.output && j.output.trim()) h+=`<div class="jtitle" style="margin-top:.5rem">你的输出</div><pre style="margin:.2rem 0 0;white-space:pre-wrap">${escapeHtml(j.output.slice(0,1200))}</pre>`;
    box.innerHTML=h;
  }catch(err){
    box.innerHTML="没跑起来："+err;
  }finally{ btns.forEach(b=>b.disabled=false); }
}
async function execute(code, cid, ex){
  const outcell=document.getElementById("outcell-"+cid), out=document.getElementById("out-"+cid);
  const stat=ex.querySelector(".runstat"), btns=ex.querySelectorAll(".play,.runall");
  const figbox=document.getElementById("figs-"+cid);
  outcell.style.display="flex"; out.textContent="运行中";
  if(figbox) figbox.innerHTML="";
  stat.textContent=""; btns.forEach(b=>b.disabled=true);
  const t0=Date.now();
  try{
    const j=await Runner.run(code, stdinOf(ex));
    out.textContent=j.output||"运行结束，无输出。别忘了 print 结果。";
    if(figbox && j.figs && j.figs.length)
      figbox.innerHTML=j.figs.map(b=>'<img src="data:image/png;base64,'+b+'">').join("");
  }catch(err){
    out.textContent="没跑起来："+err;
  }finally{
    btns.forEach(b=>b.disabled=false); stat.textContent="耗时 "+((Date.now()-t0)/1000).toFixed(1)+" 秒";
  }
}
